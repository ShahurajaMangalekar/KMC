<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Complaint Management - KMC Water</title>

<!-- Auth Guard Check -->
<script src="components/authGuard.js"></script>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary": "#0061a5",
                      "secondary-container": "#66affe",
                      "surface-container": "#efedf1",
                      "on-secondary": "#ffffff",
                      "primary-fixed": "#d6e3ff",
                      "error": "#ba1a1a",
                      "surface-variant": "#e3e2e6",
                      "surface-container-lowest": "#ffffff",
                      "on-surface-variant": "#43474e",
                      "outline": "#74777f",
                      "primary-container": "#1a365d",
                      "outline-variant": "#c4c6cf",
                      "on-background": "#1a1c1e",
                      "surface-container-low": "#f4f3f7",
                      "surface": "#faf9fd",
                      "on-primary": "#ffffff",
                      "primary": "#002045",
                      "background": "#faf9fd",
                      "error-container": "#ffdad6"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-sm": ["Inter"]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex overflow-hidden antialiased">

<!-- Reusable Component Mount: SideNavBar -->
<aside id="sidebar-container"></aside>

<!-- Main Content Area -->
<main class="flex-1 md:ml-64 flex flex-col h-screen overflow-hidden">

<!-- Reusable Component Mount: TopNavBar -->
<header id="header-container"></header>

<!-- Page Content Split View -->
<div class="flex-1 overflow-hidden flex flex-col md:flex-row relative mt-16">

<!-- Left Side: Table & Filters -->
<div class="flex-1 flex flex-col overflow-hidden bg-surface-container-low border-r border-outline-variant/60 min-w-0">

<!-- Filters / Actions Header -->
<div class="p-4 lg:p-5 border-b border-outline-variant/60 bg-surface-container-lowest shrink-0 space-y-3">
<div class="flex items-center justify-between gap-3">
<div>
  <h2 class="text-lg font-bold text-primary tracking-tight">Active Complaints</h2>
  <p class="text-xs text-on-surface-variant font-medium">Manage and resolve citizen water infrastructure reports.</p>
</div>
<button id="newTicketBtn" class="bg-primary hover:bg-primary/90 text-on-primary text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-xs transition-all shrink-0">
  <span class="material-symbols-outlined text-base">add</span>
  <span>New Ticket</span>
</button>
</div>

<!-- Filters Controls Row -->
<div class="flex flex-wrap gap-2.5 items-center justify-between">
<div class="flex flex-wrap items-center gap-2">
  <!-- Ward Filter -->
  <div class="flex items-center gap-1.5 bg-surface border border-outline-variant/80 rounded-lg px-2.5 py-1">
    <span class="material-symbols-outlined text-outline text-base">location_on</span>
    <select id="filterWard" class="bg-transparent border-none text-xs font-medium text-on-surface p-0 focus:ring-0 outline-none cursor-pointer">
      <option value="All Wards">All Wards</option>
      <option value="Ward A">Ward A</option>
      <option value="Ward B">Ward B</option>
      <option value="Ward C">Ward C</option>
      <option value="Ward D">Ward D</option>
    </select>
  </div>

  <!-- Category Filter -->
  <div class="flex items-center gap-1.5 bg-surface border border-outline-variant/80 rounded-lg px-2.5 py-1">
    <span class="material-symbols-outlined text-outline text-base">category</span>
    <select id="filterCategory" class="bg-transparent border-none text-xs font-medium text-on-surface p-0 focus:ring-0 outline-none cursor-pointer">
      <option value="All Categories">All Categories</option>
      <option value="Leakage">Leakage</option>
      <option value="Pressure">Pressure</option>
      <option value="Contamination">Contamination</option>
      <option value="Metering">Metering</option>
    </select>
  </div>

  <!-- Priority Filter -->
  <div class="flex items-center gap-1.5 bg-surface border border-outline-variant/80 rounded-lg px-2.5 py-1">
    <span class="material-symbols-outlined text-outline text-base">flag</span>
    <select id="filterPriority" class="bg-transparent border-none text-xs font-medium text-on-surface p-0 focus:ring-0 outline-none cursor-pointer">
      <option value="Any Priority">Any Priority</option>
      <option value="High">High Priority</option>
      <option value="Medium">Medium Priority</option>
      <option value="Low">Low Priority</option>
    </select>
  </div>
</div>

<!-- Status Filter Tabs -->
<div class="flex items-center gap-1 bg-surface-container border border-outline-variant/60 rounded-lg p-0.5 shrink-0">
  <button data-status="All" class="status-tab text-[11px] font-bold px-2.5 py-1 rounded-md bg-surface text-primary shadow-2xs">All</button>
  <button data-status="Open" class="status-tab text-[11px] font-semibold px-2.5 py-1 rounded-md text-on-surface-variant hover:text-primary">Open</button>
  <button data-status="In Progress" class="status-tab text-[11px] font-semibold px-2.5 py-1 rounded-md text-on-surface-variant hover:text-primary">In Progress</button>
  <button data-status="Resolved" class="status-tab text-[11px] font-semibold px-2.5 py-1 rounded-md text-on-surface-variant hover:text-primary">Resolved</button>
</div>
</div>
</div>

<!-- Table Container -->
<div class="flex-1 overflow-auto bg-surface-container-lowest relative">
<table class="w-full text-left border-collapse text-xs">
<thead class="sticky top-0 bg-surface-container-high border-b border-outline-variant/60 z-10 shadow-2xs">
<tr>
<th class="py-2.5 px-3 font-bold text-on-surface-variant uppercase tracking-wider whitespace-nowrap w-24">ID</th>
<th class="py-2.5 px-3 font-bold text-on-surface-variant uppercase tracking-wider whitespace-nowrap w-36">Category</th>
<th class="py-2.5 px-3 font-bold text-on-surface-variant uppercase tracking-wider whitespace-nowrap">Location</th>
<th class="py-2.5 px-3 font-bold text-on-surface-variant uppercase tracking-wider whitespace-nowrap w-36">Date Logged</th>
<th class="py-2.5 px-3 font-bold text-on-surface-variant uppercase tracking-wider whitespace-nowrap w-40">Assigned To</th>
<th class="py-2.5 px-3 font-bold text-on-surface-variant uppercase tracking-wider whitespace-nowrap w-28">Status</th>
</tr>
</thead>
<tbody id="complaints-table-body" class="divide-y divide-outline-variant/40">
<!-- Dynamic complaints rows rendered here -->
</tbody>
</table>
</div>

</div>

<!-- Right Side: Complaint Detail Panel -->
<aside id="detail-panel" class="w-full md:w-[360px] lg:w-[420px] bg-surface-container-lowest shrink-0 border-l border-outline-variant/60 flex flex-col h-full overflow-hidden absolute md:relative right-0 translate-x-full md:translate-x-0 transition-transform duration-300 z-30 shadow-xl md:shadow-none">

<!-- Detail Header -->
<div class="p-4 border-b border-outline-variant/60 flex justify-between items-center bg-surface shrink-0">
<div>
  <div id="detailTicketId" class="text-xs font-extrabold text-secondary tracking-wider uppercase mb-0.5">Select a Complaint</div>
  <h3 id="detailTitle" class="text-sm font-bold text-on-background truncate max-w-[260px]">Ticket Details</h3>
</div>
<button class="md:hidden p-1.5 text-on-surface-variant hover:bg-surface-container rounded-full" onclick="closeDetailPanel()">
  <span class="material-symbols-outlined text-lg">close</span>
</button>
<div class="hidden md:flex gap-1">
  <button class="p-1.5 text-on-surface-variant hover:bg-surface-container rounded-lg text-sm" title="Print Ticket"><span class="material-symbols-outlined text-[18px]">print</span></button>
  <button class="p-1.5 text-on-surface-variant hover:bg-surface-container rounded-lg text-sm" title="Options"><span class="material-symbols-outlined text-[18px]">more_vert</span></button>
</div>
</div>

<!-- Detail Scrollable Content -->
<div class="flex-1 overflow-y-auto min-h-0 p-4 space-y-4 text-xs" id="detail-content">
<!-- Dynamic content rendered when complaint row is clicked -->
</div>

<!-- Detail Footer Actions -->
<div class="p-3 bg-surface-container-low border-t border-outline-variant/60 shrink-0 flex gap-2">
  <button id="reassignBtn" class="flex-1 bg-surface border border-secondary text-secondary font-bold py-2 rounded-xl hover:bg-secondary-fixed transition-colors text-xs">
    Reassign
  </button>
  <button id="updateStatusBtn" class="flex-1 bg-primary text-on-primary font-bold py-2 rounded-xl hover:bg-primary/90 transition-colors shadow-xs text-xs">
    Update Status
  </button>
</div>
</aside>

</div>
</main>

<!-- Mobile Slide-over Overlay -->
<div class="fixed inset-0 bg-black/50 z-20 hidden" id="mobile-overlay" onclick="closeDetailPanel()"></div>

<!-- Shared Mock Data & Reusable Components -->
<script src="data/mockData.js"></script>
<script src="components/sidebar.js"></script>
<script src="components/header.js"></script>

<!-- Dynamic Page Logic -->
<script>
  let selectedComplaintId = null;
  let activeStatusFilter = 'All';

  document.addEventListener('DOMContentLoaded', async () => {
    initSidebar('complaints');
    initHeader('Complaint Management');

    // Parse URL Query Params: ?id=CMP-101
    const urlParams = new URLSearchParams(window.location.search);
    const queryId = urlParams.get('id');

    // Filter listeners
    document.getElementById('filterWard').addEventListener('change', loadComplaints);
    document.getElementById('filterCategory').addEventListener('change', loadComplaints);
    document.getElementById('filterPriority').addEventListener('change', loadComplaints);
    
    document.querySelectorAll('.status-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.status-tab').forEach(t => {
          t.className = 'status-tab text-[11px] font-semibold px-2.5 py-1 rounded-md text-on-surface-variant hover:text-primary';
        });
        e.target.className = 'status-tab text-[11px] font-bold px-2.5 py-1 rounded-md bg-surface text-primary shadow-2xs';
        activeStatusFilter = e.target.getAttribute('data-status');
        loadComplaints();
      });
    });

    document.getElementById('newTicketBtn').addEventListener('click', () => {
      alert('New Complaint Registration Form will open in Phase 2.');
    });

    document.getElementById('reassignBtn').addEventListener('click', () => {
      if (selectedComplaintId) alert(`Reassigning complaint ${selectedComplaintId} to another officer...`);
    });

    document.getElementById('updateStatusBtn').addEventListener('click', () => {
      if (selectedComplaintId) alert(`Status update logged for ${selectedComplaintId}. Notification sent to citizen.`);
    });

    await loadComplaints(queryId);
  });

  async function loadComplaints(targetId = null) {
    const filters = {
      ward: document.getElementById('filterWard').value,
      category: document.getElementById('filterCategory').value,
      priority: document.getElementById('filterPriority').value,
      status: activeStatusFilter
    };

    const complaints = await KMC_API.fetchComplaints(filters);
    const tbody = document.getElementById('complaints-table-body');

    if (complaints.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" class="p-6 text-center text-on-surface-variant italic">
            No complaints found matching selected filters.
          </td>
        </tr>
      `;
      document.getElementById('detail-content').innerHTML = `<p class="text-on-surface-variant text-center p-4">No complaint selected.</p>`;
      return;
    }

    const activeId = targetId || selectedComplaintId || complaints[0].id;
    selectedComplaintId = activeId;

    tbody.innerHTML = complaints.map(c => {
      const isSelected = c.id.toUpperCase() === selectedComplaintId.toUpperCase();
      const rowBg = isSelected 
        ? 'bg-secondary/10 border-l-4 border-secondary font-semibold' 
        : 'hover:bg-surface-container-low';
      
      let categoryIcon = 'water_damage';
      if (c.category === 'Pressure') categoryIcon = 'speed';
      if (c.category === 'Contamination') categoryIcon = 'science';
      if (c.category === 'Metering') categoryIcon = 'build';

      let statusBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-error-container text-on-error-container whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-error mr-1"></span> Open</span>`;
      if (c.status === 'In Progress') statusBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-secondary-fixed text-on-secondary-fixed whitespace-nowrap">In Progress</span>`;
      if (c.status === 'Resolved') statusBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#d1fae5] text-[#065f46] whitespace-nowrap">Resolved</span>`;

      return `
        <tr 
          class="${rowBg} transition-colors cursor-pointer group"
          onclick="selectComplaint('${c.id}')"
        >
          <td class="py-2.5 px-3 font-bold text-primary whitespace-nowrap">${c.id}</td>
          <td class="py-2.5 px-3 whitespace-nowrap">
            <div class="flex items-center gap-1.5 font-bold">
              <span class="material-symbols-outlined text-secondary text-base">${categoryIcon}</span>
              <span>${c.category}</span>
            </div>
          </td>
          <td class="py-2.5 px-3 text-on-surface-variant truncate max-w-[170px] whitespace-nowrap" title="${c.location}">${c.location}</td>
          <td class="py-2.5 px-3 text-on-surface-variant whitespace-nowrap">${c.date}</td>
          <td class="py-2.5 px-3 whitespace-nowrap">
            <div class="flex items-center gap-1.5">
              <div class="w-5 h-5 rounded-full bg-primary-container text-white text-[9px] flex items-center justify-center font-bold">${c.assignedTo.split(' ').map(n=>n[0]).join('')}</div>
              <span class="font-medium">${c.assignedTo}</span>
            </div>
          </td>
          <td class="py-2.5 px-3 whitespace-nowrap">${statusBadge}</td>
        </tr>
      `;
    }).join('');

    renderComplaintDetails(selectedComplaintId);
  }

  async function selectComplaint(id) {
    selectedComplaintId = id;
    loadComplaints(id);

    if (window.innerWidth < 768) {
      document.getElementById('detail-panel').classList.remove('translate-x-full');
      document.getElementById('mobile-overlay').classList.remove('hidden');
    }
  }

  async function renderComplaintDetails(id) {
    const c = await KMC_API.fetchComplaintById(id);
    if (!c) return;

    document.getElementById('detailTicketId').textContent = `Ticket #${c.id}`;
    document.getElementById('detailTitle').textContent = `${c.category} Report - ${c.ward}`;

    let statusColor = 'bg-error';
    if (c.status === 'In Progress') statusColor = 'bg-amber-500';
    if (c.status === 'Resolved') statusColor = 'bg-emerald-600';

    const photoUrl = c.photoUrl || 'https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=600&q=80';

    const detailContent = document.getElementById('detail-content');
    detailContent.innerHTML = `
      <div class="grid grid-cols-2 gap-2">
        <div class="bg-surface border border-outline-variant/60 rounded-xl p-2.5">
          <div class="text-[10px] font-bold text-on-surface-variant uppercase mb-0.5">Current Status</div>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full ${statusColor}"></span>
            <span class="font-bold text-on-surface">${c.status}</span>
          </div>
        </div>
        <div class="bg-surface border border-outline-variant/60 rounded-xl p-2.5">
          <div class="text-[10px] font-bold text-on-surface-variant uppercase mb-0.5">Assigned Officer</div>
          <div class="flex items-center gap-1.5">
            <div class="w-4 h-4 rounded-full bg-primary-container text-white text-[8px] flex items-center justify-center font-bold">
              ${c.assignedTo.split(' ').map(n=>n[0]).join('')}
            </div>
            <span class="font-bold text-on-surface truncate">${c.assignedTo}</span>
          </div>
        </div>
      </div>

      <!-- Citizen Info -->
      <div class="bg-surface border border-outline-variant/60 rounded-xl p-2.5">
        <div class="text-[10px] font-bold text-on-surface-variant uppercase mb-0.5">Citizen Reporter</div>
        <div class="font-bold text-primary">${c.citizenName}</div>
        <div class="text-[11px] text-on-surface-variant font-medium mt-0.5">${c.phone} &bull; ${c.date}</div>
      </div>

      <!-- Photo Evidence -->
      <div>
        <div class="font-bold text-on-surface mb-1 text-xs">Evidence Photo</div>
        <div class="w-full h-36 bg-surface-container rounded-xl border border-outline-variant/60 overflow-hidden relative group cursor-pointer shadow-2xs">
          <img src="${photoUrl}" class="w-full h-full object-cover" alt="Water pipeline leakage evidence photo" />
          <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
            <span class="material-symbols-outlined text-white text-2xl">zoom_in</span>
          </div>
        </div>
      </div>

      <!-- Description -->
      <div>
        <div class="font-bold text-on-surface mb-1 text-xs">Description</div>
        <p class="text-xs text-on-surface-variant bg-surface-container-low p-2.5 rounded-xl border border-outline-variant/60 font-medium">
          "${c.description}"
        </p>
      </div>

      <!-- Location Details -->
      <div>
        <div class="font-bold text-on-surface mb-1 text-xs flex items-center justify-between">
          <span>Location Details</span>
          <a href="GIS_Water_Network.html" class="text-secondary text-[11px] hover:underline font-bold">Open in GIS</a>
        </div>
        <div class="bg-surface border border-outline-variant/60 rounded-xl p-2.5 flex items-start gap-2">
          <span class="material-symbols-outlined text-secondary text-base shrink-0 mt-0.5">pin_drop</span>
          <div>
            <div class="font-bold text-on-surface">${c.location}</div>
            <div class="text-[10px] text-outline font-mono mt-0.5">Lat: ${c.lat}, Lng: ${c.lng}</div>
          </div>
        </div>
      </div>

      <!-- Activity Timeline -->
      <div>
        <div class="font-bold text-on-surface mb-2 text-xs">Activity Log</div>
        <div class="relative border-l border-outline-variant/60 ml-2 space-y-3 pb-1">
          <div class="relative pl-4">
            <div class="absolute w-2 h-2 bg-secondary rounded-full -left-[4.5px] top-1"></div>
            <div class="text-[10px] font-bold text-on-surface-variant">${c.date}</div>
            <div class="text-xs text-on-surface font-medium mt-0.5">Assigned to officer ${c.assignedTo}.</div>
          </div>
          <div class="relative pl-4">
            <div class="absolute w-2 h-2 bg-outline-variant rounded-full -left-[4.5px] top-1"></div>
            <div class="text-[10px] font-bold text-on-surface-variant">${c.date}</div>
            <div class="text-xs text-on-surface font-medium mt-0.5">Ticket created by citizen ${c.citizenName}.</div>
          </div>
        </div>
      </div>
    `;
  }

  function closeDetailPanel() {
    document.getElementById('detail-panel').classList.add('translate-x-full');
    document.getElementById('mobile-overlay').classList.add('hidden');
  }
</script>
</body>
</html>
